name: Build app

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json is $PKG but the release tag is $TAG - bump one of them."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist
      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.exe
